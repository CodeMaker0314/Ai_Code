name: Run headless training

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  run-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libsdl2-dev libsdl2-image-dev libsmpeg-dev libportmidi-dev \
            libfreetype6-dev libjpeg-dev zlib1g-dev libavcodec-dev libavformat-dev libswscale-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Make runner executable
        run: chmod +x run_headless.sh

      - name: Run headless training
        run: ./run_headless.sh
        timeout-minutes: 30

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            src/results/**
            src/replays/**