name: Run headless training

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
  schedule:
    # 每天台灣時間 08:00 觸發
    - cron: '0 0 * * *'

jobs:
  run-training:
    # Skip running this job if the actor is the bot (prevents recursive runs)
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 540
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libsdl2-dev libsdl2-image-dev libsmpeg-dev libportmidi-dev \
            libfreetype6-dev libjpeg-dev zlib1g-dev libavcodec-dev libavformat-dev libswscale-dev \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Make runner executable
        run: chmod +x run_headless.sh

      - name: Run headless training
        run: xvfb-run -s "-screen 0 640x480x24" ./run_headless.sh

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            src/results/**
            src/replays/**

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure destination folder exists and copy results
          mkdir -p src/result
          cp -r src/results/. src/result/ || true
            git add src/result || true
            git commit -m "CI: add results to src/result from run ${{ github.run_id }}" || echo "No changes to commit"
            git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}